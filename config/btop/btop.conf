#? Config file for btop v. 1.4.7
#
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# BTOP - system monitor behind the Status tile.
#
# Only what differs from btop's defaults; btop takes the rest
# from its factory settings (btop --default-config shows everything).
#
# save_config_on_exit = False is REQUIRED. By default btop writes out the
# full config its own way on exit - the comments here would disappear, and
# install.sh would then see the file as changed locally and keep btop's
# version instead of updating it from the repository.
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

# Theme in the dark-fantasy palette - config/btop/themes/dark-fantasy.theme.
# btop looks up themes by name in ~/.config/btop/themes/.
color_theme = "dark-fantasy"

# No background of its own: the kitty background shows through the window
# (panel.conf, opacity 0.96) with Hyprland's blur and grain - like every desktop panel.
theme_background = False

truecolor = True

# Sharp frame corners - the theme has no rounding anywhere.
rounded_corners = False

# No gradients - graphs and the process list are painted in a single color.
proc_gradient = False

save_config_on_exit = False
