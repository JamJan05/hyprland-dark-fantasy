# Order of xdg-desktop-portal backends in the Hyprland session.
#
# THREE portals are registered on this system at once:
#   /usr/share/xdg-desktop-portal/portals/hyprland.portal
#   /usr/share/xdg-desktop-portal/portals/kde.portal
#   /usr/share/xdg-desktop-portal/portals/gtk.portal
#
# Without this file xdg-desktop-portal picks the backend by itself and can route
# screen sharing to the KDE portal, which has nothing to talk to outside a Plasma
# session. Symptom: in Zoom, Discord or OBS the window list is empty or the
# picker dialog does not appear at all.
#
# The file name matters: it must match XDG_CURRENT_DESKTOP, which
# Hyprland sets to "Hyprland" (matching is case-insensitive,
# hence "hyprland-portals.conf").

[preferred]
# Hyprland by default, and GTK when it does not support something.
default = hyprland;gtk

# Screenshots, screen sharing and global shortcuts are handled only by the
# Hyprland portal - it is the only one that knows anything about this compositor's windows.
org.freedesktop.impl.portal.Screenshot = hyprland
org.freedesktop.impl.portal.ScreenCast = hyprland
org.freedesktop.impl.portal.GlobalShortcuts = hyprland

# File chooser dialog. GTK is a safer choice here than KDE, because the KDE portal
# outside a Plasma session needs running kded services and can hang.
# If you prefer a Dolphin-style dialog, change "gtk" to "kde" - the KDE portal is
# installed (kde-plasma/xdg-desktop-portal-kde).
org.freedesktop.impl.portal.FileChooser = gtk
