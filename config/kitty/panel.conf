# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# KITTY IN A PANEL WINDOW - Status (btop).
#
# The Status tile opens btop in a floating window above the desktop (the
# "df-panel" rule in config/hypr/hyprland.lua). Yazi from the Satchel opens
# as a regular tiled window and does not use this file. Such a window
# is a panel, not a terminal for work, so it gets two changes:
#
#   - opacity 0.96 instead of 0.82: the panel sits above the dimmed desktop
#     and above other windows, and at 0.82 the btop table and the yazi file list
#     would get lost in whatever shows through from underneath;
#   - 16 px padding: the content does not stick to the window frame, just like in
#     the Quickshell shell panels (Theme.spacingLg).
#
# This file is NOT standalone. The local/bin/monitor-systemu wrapper passes it
# as the SECOND --config, after kitty.conf - kitty
# reads the files in order and a later one overrides an earlier one, so the palette,
# fonts and scrolling stay from kitty.conf, and only what is below changes.
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

background_opacity    0.96
window_padding_width  16
