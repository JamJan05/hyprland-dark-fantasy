[General]
# Language of the login screen: en (default) or pl.
#
# The greeter runs as the "sddm" user before anyone logs in, so it cannot
# read Cogwheel -> Language. install-theme.sh writes the choice into the
# installed copy (--lang en|pl, default: the language set in the shell).
language=en

# Login screen wallpaper.
#
# The path is RELATIVE to the theme directory. The file must be inside
# /usr/share/sddm/themes/dark-fantasy/, because the greeter runs as the user
# "sddm" and has NO access to your home directory - pointing to
# ~/Obrazy/... would end with a black background and no message at all.
background=backgrounds/wallpaper.png

# Wallpaper blur strength (0 = none, 1 = maximum).
blurAmount=0.85

# Wallpaper dimming under the text, 0.0 - 1.0.
dimAmount=0.55

# Fonts. Both must be installed system-wide, because the "sddm" user
# does not see fonts from your ~/.local/share/fonts.
#   fontFamily  - clock and password field (media-fonts/nerdfonts)
#   fontDisplay - all labels, in small caps (media-fonts/eb-garamond)
fontFamily=JetBrainsMono Nerd Font
fontDisplay=EB Garamond

# Text at the bottom edge. Original - hyprlock carries the same one.
#
# THE QUOTES ARE REQUIRED. SDDM reads this file through QSettings, and QSettings
# turns a value with a comma into a LIST of strings - without quotes the motto
# fell apart into two elements and the login screen showed just "Pp".
#
# Left unset on purpose: the theme then shows its built-in motto in the
# language above ("Ash remembers, the flame waits" in English, the Polish
# original in Polish). Setting motto= replaces it in BOTH languages.
#motto="Ash remembers, the flame waits"
